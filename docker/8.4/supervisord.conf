[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Default worker — handles assembly, thumbnail generation, and all other lightweight jobs.
[program:queue-worker]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dedicated OCR worker — isolated so heavy Tesseract/pdftoppm jobs cannot
; block thumbnail generation or file assembly on the default queue.
; Run this on a separate process (or server) with more memory/CPU headroom.
; Scale numprocs up if you have multiple CPU cores to spare for OCR.
[program:queue-worker-ocr]
command=/usr/bin/php /var/www/html/artisan queue:work --queue=%(ENV_SUPERVISOR_OCR_QUEUE)s --sleep=%(ENV_SUPERVISOR_OCR_SLEEP)s --tries=%(ENV_SUPERVISOR_OCR_TRIES)s --max-time=%(ENV_SUPERVISOR_OCR_MAX_TIME)s --timeout=%(ENV_SUPERVISOR_OCR_TIMEOUT)s --memory=%(ENV_SUPERVISOR_OCR_MEMORY)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
autostart=true
autorestart=true
numprocs=%(ENV_SUPERVISOR_OCR_NUMPROCS)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
